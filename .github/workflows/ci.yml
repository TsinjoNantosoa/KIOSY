name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kiosy
          POSTGRES_USER: kiosy
          POSTGRES_PASSWORD: kiosy-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kiosy -d kiosy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.15.3
        ports: ["6333:6333"]
      s3mock:
        image: adobe/s3mock:5.1.0
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: kiosy-private
        ports: ["9090:9090"]
    defaults:
      run:
        working-directory: backend
    env:
      KIOSY_ENV: test
      KIOSY_DATABASE_URL: postgresql+psycopg://kiosy:kiosy-ci-only@localhost:5432/kiosy
      KIOSY_SECRET_KEY: ci-placeholder-secret-key-at-least-32-characters
      KIOSY_LLM_PROVIDER: deterministic
      KIOSY_QDRANT_URL: http://localhost:6333
      KIOSY_STORAGE_ENDPOINT: http://localhost:9090
      KIOSY_STORAGE_BUCKET: kiosy-private
      KIOSY_STORAGE_ACCESS_KEY: ci-local-s3-key
      KIOSY_STORAGE_SECRET_KEY: ci-local-s3-secret-not-production
      KIOSY_TEST_PAYMENT_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: python -m app.scripts.setup_checkpointer
      - run: python -m app.scripts.seed
        env:
          KIOSY_SEED_PASSWORD: Demo-password-for-CI-only-2026!
      - run: python -m ruff check app tests migrations
      - run: python -m mypy app
        continue-on-error: true # Dette typée suivie : rendre bloquant lorsque le baseline strict est résorbé.
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_APP_MODE: demo
      - run: npm run build
        env:
          VITE_APP_MODE: api
          VITE_API_BASE_URL: https://api.invalid.example

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --workers=2
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results
          if-no-files-found: ignore

  e2e-api:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kiosy
          POSTGRES_USER: kiosy
          POSTGRES_PASSWORD: kiosy-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kiosy -d kiosy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.15.3
        ports: ["6333:6333"]
      s3mock:
        image: adobe/s3mock:5.1.0
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: kiosy-private
        ports: ["9090:9090"]
    env:
      KIOSY_ENV: test
      KIOSY_DATABASE_URL: postgresql+psycopg://kiosy:kiosy-ci-only@localhost:5432/kiosy
      KIOSY_SECRET_KEY: ci-placeholder-secret-key-at-least-32-characters
      KIOSY_LLM_PROVIDER: deterministic
      KIOSY_EMBEDDING_PROVIDER: deterministic
      KIOSY_QDRANT_URL: http://localhost:6333
      KIOSY_STORAGE_ENDPOINT: http://localhost:9090
      KIOSY_STORAGE_BUCKET: kiosy-private
      KIOSY_STORAGE_ACCESS_KEY: ci-local-s3-key
      KIOSY_STORAGE_SECRET_KEY: ci-local-s3-secret-not-production
      KIOSY_TEST_PAYMENT_ENABLED: "true"
      KIOSY_FRONTEND_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: pip install -e "backend[dev]"
      - run: python -m alembic upgrade head
        working-directory: backend
      - run: python -m app.scripts.setup_checkpointer
        working-directory: backend
      - run: python -m app.scripts.seed
        working-directory: backend
        env:
          KIOSY_SEED_PASSWORD: Demo-password-for-CI-only-2026!
      - name: Start API and durable worker
        run: |
          (cd backend && nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../api-e2e.log 2>&1 &)
          (cd backend && nohup python -m app.workers.runner > ../worker-e2e.log 2>&1 &)
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:8000/health/ready && exit 0
            sleep 1
          done
          exit 1
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e:api
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-api-report
          path: |
            frontend/test-results
            api-e2e.log
            worker-e2e.log
          if-no-files-found: ignore

  azure-live:
    if: ${{ vars.RUN_AZURE_LIVE_TESTS == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      RUN_AZURE_LIVE_TESTS: "true"
      KIOSY_ENABLE_LIVE_AZURE: "true"
      LLM_PROVIDER: azure
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
      AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m app.scripts.diagnose_azure
