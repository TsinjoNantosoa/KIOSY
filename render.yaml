services:
  - type: web
    name: kiosy-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health/ready
    preDeployCommand: alembic upgrade head
    envVars:
      - key: KIOSY_ENV
        value: production
      - key: KIOSY_DATABASE_URL
        fromDatabase: { name: kiosy-postgres, property: connectionString }
      - key: KIOSY_SECRET_KEY
        generateValue: true
      - key: KIOSY_TEST_PAYMENT_ENABLED
        value: "false"
  - type: worker
    name: kiosy-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python -m app.workers.runner
    envVars:
      - key: KIOSY_ENV
        value: production
      - key: KIOSY_DATABASE_URL
        fromDatabase: { name: kiosy-postgres, property: connectionString }
      - key: KIOSY_SECRET_KEY
        sync: false
      - key: KIOSY_TEST_PAYMENT_ENABLED
        value: "false"

databases:
  - name: kiosy-postgres
    databaseName: kiosy
    user: kiosy
