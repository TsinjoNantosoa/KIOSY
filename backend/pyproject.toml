[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "kiosy-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.5",
  "argon2-cffi==25.1.0",
  "boto3==1.40.40",
  "email-validator==2.3.0",
  "fastapi==0.118.0",
  "httpx==0.28.1",
  "langgraph==0.6.8",
  "langgraph-checkpoint-postgres==2.0.23",
  "mcp==2.0.0",
  "openai==2.1.0",
  "psycopg[binary,pool]==3.2.10",
  "pydantic-settings==2.11.0",
  "pypdf==6.1.1",
  "python-multipart==0.0.20",
  "qdrant-client==1.15.1",
  "sqlalchemy==2.0.43",
  "structlog==25.4.0",
  "uvicorn[standard]==0.37.0",
]

[project.optional-dependencies]
dev = [
  "anyio==4.11.0",
  "mypy==1.18.2",
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "pytest-xdist==3.8.0",
  "ruff==0.13.3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
  "postgres: requires the PostgreSQL integration database",
  "live_azure: requires explicitly enabled live Azure access",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
