services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kiosy
      POSTGRES_USER: kiosy
      POSTGRES_PASSWORD: kiosy-local-only
    ports: ["5432:5432"]
    volumes: ["kiosy_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiosy -d kiosy"]
      interval: 3s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.15.3
    ports: ["6333:6333"]
    volumes: ["kiosy_qdrant:/qdrant/storage"]

  s3mock:
    image: adobe/s3mock:5.1.0
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: kiosy-private
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports: ["9090:9090"]
    volumes: ["kiosy_s3mock:/s3mockroot"]

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      KIOSY_DATABASE_URL: postgresql+psycopg://kiosy:kiosy-local-only@postgres:5432/kiosy
      KIOSY_STORAGE_ENDPOINT: http://s3mock:9090
      KIOSY_QDRANT_URL: http://qdrant:6333
      KIOSY_SMTP_HOST: mailpit
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      s3mock: { condition: service_started }
      qdrant: { condition: service_started }

  worker:
    build: ./backend
    env_file: ./backend/.env
    environment:
      KIOSY_DATABASE_URL: postgresql+psycopg://kiosy:kiosy-local-only@postgres:5432/kiosy
      KIOSY_STORAGE_ENDPOINT: http://s3mock:9090
      KIOSY_QDRANT_URL: http://qdrant:6333
      KIOSY_SMTP_HOST: mailpit
    command: python -m app.workers.runner
    depends_on:
      postgres: { condition: service_healthy }
      s3mock: { condition: service_started }
      qdrant: { condition: service_started }

volumes:
  kiosy_postgres:
  kiosy_qdrant:
  kiosy_s3mock:
